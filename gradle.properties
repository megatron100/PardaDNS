# Project-wide Gradle settings.
# For more details: https://docs.gradle.org/current/userguide/build_environment.html

# --- JVM / Memory ---
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Parallelism & Caching ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true